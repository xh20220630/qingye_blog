name: qingye-blog

services:
  blog:
    image: qingye-blog:${QY_IMAGE_TAG:-local}
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    init: true
    restart: unless-stopped
    ports:
      - '${QY_BIND_IP:-127.0.0.1}:${QY_HTTP_PORT:-8080}:4324'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
