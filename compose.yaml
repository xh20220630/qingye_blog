name: qingye-blog

services:
  blog:
    image: qingye-blog:${QY_IMAGE_TAG:-local}
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    init: true
    restart: unless-stopped
    ports:
      - "${QY_BIND_IP:-127.0.0.1}:${QY_HTTP_PORT:-8080}:4324"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4324"
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      QY_TRUST_PROXY: ${QY_TRUST_PROXY:-false}
      QY_DATA_DIR: /data
      QY_STATIC_DIR: /app/dist
    volumes:
      - blog-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  blog-data:
